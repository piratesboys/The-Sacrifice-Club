<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Members ♟️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="members-page">

        <h1>♟️ CLUB MEMBERS</h1>

        <p>
            The players who make The Sacrifice Club stronger every day.
        </p>

        <p>
            <a href="https://the-sacrifice-club.netlify.app/">
                ⬅ Back to Home
            </a>
        </p>

        <section>
            <h2>♟️ Members</h2>

            <div id="members">
                <p>Loading members...</p>
            </div>
        </section>

        <section>
            <h2>🔥 More members coming soon!</h2>
        </section>

        <footer>
            <h2>🔥 LONG LIVE ATTACKING CHESS! ♟️</h2>

            <p>The Sacrifice Club - Official Lichess Team</p>

            <p>
                <a
                    href="https://lichess.org/team/the-sacrifice-club"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Visit our Lichess Team
                </a>
            </p>
        </footer>

    </main>

    <script>
        async function loadMembers() {

            const container = document.getElementById("members");

            try {

                const response = await fetch("/api/members");

                if (!response.ok) {
                    throw new Error("Server error");
                }

                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || "Unable to load members");
                }

                if (!data.members || data.members.length === 0) {
                    container.innerHTML = "<p>No members found.</p>";
                    return;
                }

                container.innerHTML = "";

                data.members.forEach(function(member) {

                    const card = document.createElement("div");

                    card.className = "member-card";

                    const username =
                        member.username || "Unknown player";

                    const title = document.createElement("h3");

                    title.textContent = "♟️ " + username;

                    card.appendChild(title);

                    container.appendChild(card);
                });

            } catch (error) {

                console.error("Members error:", error);

                container.innerHTML =
                    "<p>🔴 Unable to update members</p>";
            }
        }

        loadMembers();
    </script>

</body>
</html>
