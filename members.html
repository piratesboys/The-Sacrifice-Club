<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Club Members ♟️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="members-page">

        <!-- HEADER -->

        <header class="members-header">

            <h1>♟️ CLUB MEMBERS</h1>

            <p>
                The players who make The Sacrifice Club
                stronger every day.
            </p>

            <a class="button" href="index.html">
                ⬅ Back to Home
            </a>

        </header>


        <!-- MEMBERS -->

        <section class="members-section">

            <h2>♟️ Members</h2>


            <!-- MEMBER COUNT -->

            <div class="members-count">

                <span id="member-count">
                    Loading...
                </span>

                <span class="count-label">
                    members
                </span>

            </div>


            <!-- LAST UPDATE -->

            <p
                id="last-update"
                class="last-update"
            >
                Updating...
            </p>


            <!-- MEMBERS LIST -->

            <div id="members">

                <p class="loading">
                    Loading members...
                </p>

            </div>

        </section>


        <!-- MORE MEMBERS -->

        <section class="more-members">

            <h2>
                🔥 More members coming soon!
            </h2>

        </section>


        <!-- FOOTER -->

        <footer>

            <h2>
                🔥 LONG LIVE ATTACKING CHESS! ♟️
            </h2>

            <p>
                The Sacrifice Club - Official Lichess Team
            </p>

            <p>

                <a
                    href="https://lichess.org/team/the-sacrifice-club"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Visit our Lichess Team
                </a>

            </p>

        </footer>

    </main>


    <script>

        /*
         * ==========================================
         * CONFIGURATION
         * ==========================================
         */

        const API_URL =
            "https://lichess.org/api/team/the-sacrifice-club/users";

        /*
         * Mise à jour toutes les 30 secondes
         */
        const UPDATE_INTERVAL = 30000;


        /*
         * ==========================================
         * LOAD MEMBERS
         * ==========================================
         */

        async function loadMembers() {

            const container =
                document.getElementById("members");

            const count =
                document.getElementById("member-count");

            const lastUpdate =
                document.getElementById("last-update");


            try {

                /*
                 * Demande les membres à Lichess
                 */

                const response = await fetch(
                    API_URL,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


                /*
                 * Vérifie la réponse
                 */

                if (!response.ok) {

                    throw new Error(
                        "Lichess returned HTTP " +
                        response.status
                    );

                }


                /*
                 * L'API renvoie du JSONL :
                 * un objet JSON par ligne.
                 */

                const text =
                    await response.text();


                const members =
                    text
                        .split("\n")
                        .filter(
                            line =>
                                line.trim() !== ""
                        )
                        .map(
                            line =>
                                JSON.parse(line)
                        );


                /*
                 * ==================================
                 * NO MEMBERS
                 * ==================================
                 */

                if (members.length === 0) {

                    count.textContent = "0";

                    container.innerHTML =
                        "<p>No members found.</p>";

                    return;

                }


                /*
                 * ==================================
                 * MEMBER COUNT
                 * ==================================
                 */

                count.textContent =
                    members.length;


                /*
                 * ==================================
                 * CREATE MEMBER CARDS
                 * ==================================
                 */

                const fragment =
                    document.createDocumentFragment();


                members.forEach(
                    member => {

                        /*
                         * Username
                         */

                        const username =
                            member.username ||
                            member.name ||
                            member.id;


                        if (!username) {
                            return;
                        }


                        /*
                         * Member card
                         */

                        const card =
                            document.createElement(
                                "a"
                            );


                        card.className =
                            "member-card";


                        /*
                         * Lien vers le profil Lichess
                         */

                        card.href =
                            "https://lichess.org/@" +
                            encodeURIComponent(
                                username
                            );


                        card.target = "_blank";


                        card.rel =
                            "noopener noreferrer";


                        /*
                         * ==================================
                         * AVATAR
                         * ==================================
                         */

                        const avatar =
                            document.createElement(
                                "img"
                            );


                        /*
                         * Avatar Lichess
                         */

                        avatar.src =
                            "https://lichess1.org/" +
                            "user/" +
                            encodeURIComponent(
                                username
                            ) +
                            "/avatar";


                        avatar.alt =
                            username +
                            " avatar";


                        avatar.className =
                            "member-avatar";


                        /*
                         * Si l'avatar ne fonctionne pas,
                         * on utilise l'avatar par défaut.
                         */

                        avatar.onerror =
                            function() {

                                this.src =
                                    "https://lichess1.org/" +
                                    "assets/logo/lichess-favicon-512.png";

                            };


                        /*
                         * ==================================
                         * USERNAME
                         * ==================================
                         */

                        const name =
                            document.createElement(
                                "span"
                            );


                        name.className =
                            "member-name";


                        name.textContent =
                            "♟️ " + username;


                        /*
                         * ==================================
                         * ADD TO CARD
                         * ==================================
                         */

                        card.appendChild(
                            avatar
                        );

                        card.appendChild(
                            name
                        );


                        fragment.appendChild(
                            card
                        );

                    }
                );


                /*
                 * ==================================
                 * DISPLAY EVERYTHING
                 * ==================================
                 */

                container.innerHTML = "";

                container.appendChild(
                    fragment
                );


                /*
                 * ==================================
                 * LAST UPDATE
                 * ==================================
                 */

                const now =
                    new Date();


                lastUpdate.textContent =
                    "Last updated: " +
                    now.toLocaleTimeString();


                console.log(
                    "Lichess members updated:",
                    members.length
                );


            } catch (error) {

                /*
                 * ==================================
                 * ERROR
                 * ==================================
                 */

                console.error(
                    "Unable to load Lichess members:",
                    error
                );


                count.textContent = "—";


                container.innerHTML =
                    `
                    <p>
                        🔴 Unable to update members.
                        <br>
                        Please try again later.
                    </p>
                    `;


                lastUpdate.textContent =
                    "Update failed";

            }

        }


        /*
         * ==========================================
         * FIRST UPDATE
         * ==========================================
         */

        loadMembers();


        /*
         * ==========================================
         * AUTOMATIC UPDATE
         * ==========================================
         *
         * Toutes les 30 secondes,
         * le site demande à Lichess
         * s'il y a de nouveaux membres.
         *
         */

        setInterval(
            loadMembers,
            UPDATE_INTERVAL
        );

    </script>


</body>

</html>
