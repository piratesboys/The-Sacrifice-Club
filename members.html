<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Members ♟️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>♟️ CLUB MEMBERS</h1>

    <p>
        The players who make The Sacrifice Club stronger every day.
    </p>

    <p>
        <a href="index.html">⬅ Back to Home</a>
    </p>

    <h2>♟️ Members</h2>

    <div id="members">
        Loading members...
    </div>

    <h2>🔥 More members coming soon!</h2>

    <footer>
        <p>🔥 LONG LIVE ATTACKING CHESS! ♟️</p>
        <p>The Sacrifice Club - Official Lichess Team</p>
        <p>
            <a href="https://lichess.org/team/the-sacrifice-club" target="_blank">
                Visit our Lichess Team
            </a>
        </p>
    </footer>

</main>

<script>
    const TEAM_ID = "the-sacrifice-club";
    const membersContainer = document.getElementById("members");

    async function loadMembers() {
        try {
            const response = await fetch(
                `https://lichess.org/api/team/${TEAM_ID}/users`
            );

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const members = await response.json();

            membersContainer.innerHTML = "";

            members.forEach(member => {
                if (!member.username) return;

                const link = document.createElement("a");
                link.href = `https://lichess.org/@/${encodeURIComponent(member.username)}`;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = `♟️ ${member.username}`;

                const div = document.createElement("div");
                div.appendChild(link);

                membersContainer.appendChild(div);
            });

            if (membersContainer.children.length === 0) {
                membersContainer.textContent = "No members found.";
            }

        } catch (error) {
            console.error("Unable to load members:", error);
            membersContainer.textContent =
                "🔴 Unable to update members";
        }
    }

    loadMembers();
</script>

</body>
</html>
