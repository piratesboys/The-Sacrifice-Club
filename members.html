<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Club Members ♟️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="members-page">

        <header class="members-header">

            <h1>♟️ CLUB MEMBERS</h1>

            <p>
                The players who make The Sacrifice Club stronger every day.
            </p>

            <a class="button" href="index.html">
                ⬅ Back to Home
            </a>

        </header>


        <section class="members-section">

            <h2>♟️ Members</h2>

            <div id="members">
                <p class="loading">Loading members...</p>
            </div>

        </section>


        <section class="more-members">

            <h2>🔥 More members coming soon!</h2>

        </section>


        <footer>

            <h2>🔥 LONG LIVE ATTACKING CHESS! ♟️</h2>

            <p>
                The Sacrifice Club - Official Lichess Team
            </p>

            <p>
                <a
                    href="https://lichess.org/team/the-sacrifice-club"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Visit our Lichess Team
                </a>
            </p>

        </footer>

    </main>


    <script>

        const MEMBERS_API =
            "https://lichess.org/api/team/the-sacrifice-club/users";

        async function loadMembers() {

            const container =
                document.getElementById("members");

            try {

                const response = await fetch(
                    MEMBERS_API,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        "Lichess returned HTTP " +
                        response.status
                    );
                }

                const text =
                    await response.text();

                const lines = text
                    .split("\n")
                    .filter(function(line) {
                        return line.trim() !== "";
                    });

                const members =
                    lines.map(function(line) {
                        return JSON.parse(line);
                    });

                /*
                 * Si aucun membre n'est trouvé
                 */
                if (members.length === 0) {

                    container.innerHTML =
                        "<p>No members found.</p>";

                    return;
                }

                /*
                 * Création de la liste
                 */
                container.innerHTML = "";

                members.forEach(function(member) {

                    const card =
                        document.createElement("div");

                    card.className =
                        "member-card";


                    const username =
                        member.username ||
                        "Unknown player";


                    const link =
                        document.createElement("a");

                    link.href =
                        "https://lichess.org/@" +
                        encodeURIComponent(username);

                    link.target = "_blank";

                    link.rel =
                        "noopener noreferrer";

                    link.textContent =
                        "♟️ " + username;


                    card.appendChild(link);

                    container.appendChild(card);

                });

                console.log(
                    "Members updated:",
                    members.length
                );

            } catch (error) {

                console.error(
                    "Unable to load Lichess members:",
                    error
                );

                container.innerHTML =
                    "<p>🔴 Unable to update members</p>";
            }
        }


        /*
         * Charge les membres dès l'ouverture
         */
        loadMembers();


        /*
         * Vérifie automatiquement les changements
         * toutes les 30 secondes.
         */
        setInterval(function() {

            loadMembers();

        }, 30000);

    </script>

</body>
</html>
